# Tiny Tapeout project information
project:
  title: "NanoV RV32E RISC-V processor"
  author: "Wai Ming Lee"
  discord: ""
  description: "Silicon-proven bit-serial RV32E core with external SPI RAM, GPIO, and UART"
  language: "Verilog"
  clock_hz: 12000000

  # Preserve the silicon-proven TT04 NanoV footprint on SKY130.
  tiles: "1x2"

  # Tiny Tapeout requires the GitHub username in the submitted top-module name.
  top_module: "tt_um_WaiMingLee888_nanov"

  source_files:
    - "tt_top.v"
    - "nanoV/alu.v"
    - "nanoV/core.v"
    - "nanoV/cpu.v"
    - "nanoV/register.v"
    - "nanoV/shift.v"
    - "nanoV/multiply.v"
    - "nanoV/uart/uart_tx.v"
    - "nanoV/uart/uart_rx.v"

pinout:
  # General-purpose inputs, readable at address 0x10000004.
  ui[0]: "GPIO input 0"
  ui[1]: "GPIO input 1"
  ui[2]: "GPIO input 2"
  ui[3]: "GPIO input 3"
  ui[4]: "GPIO input 4"
  ui[5]: "GPIO input 5"
  ui[6]: "GPIO input 6"
  ui[7]: "GPIO input 7"

  # GPIO outputs at address 0x10000000; also suitable for a 7-segment display.
  uo[0]: "GPIO output 0 / segment a"
  uo[1]: "GPIO output 1 / segment b"
  uo[2]: "GPIO output 2 / segment c"
  uo[3]: "GPIO output 3 / segment d"
  uo[4]: "GPIO output 4 / segment e"
  uo[5]: "GPIO output 5 / segment f"
  uo[6]: "GPIO output 6 / segment g"
  uo[7]: "GPIO output 7 / decimal point"

  uio[0]: "SPI RAM MOSI"
  uio[1]: "SPI RAM chip select, active low"
  uio[2]: "SPI RAM clock"
  uio[3]: "SPI RAM MISO"
  uio[4]: "UART RX"
  uio[5]: "UART TX"
  uio[6]: "UART RTS, active low"
  uio[7]: "SPI RAM HOLD, active low"

# Do not change.
yaml_version: 6
